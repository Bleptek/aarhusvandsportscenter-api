name: Variable substitution
description: substitues environment variables for dev and production

inputs:
  hostname:
    required: true
  db_connectionstring:
    required: true
  auth_jwtkey:
    required: true
  contact_mail_to_email:
    required: true
  email_password:
    required: true

runs:
  using: "composite"
  steps:
    - uses: microsoft/variable-substitution@v1 
      with:
        files: './src/Aarhusvandsportscenter.Api/appsettings.json'
      env:
        ConnectionStrings.DbConnection: ${{inputs.db_connectionstring}}
        Authorization.Issuer: "${{inputs.hostname}}/api"
        Authorization.Audience: "${{inputs.hostname}}/api"
        Authorization.JwtKey: ${{inputs.auth_jwtkey}}
        SimplySmtp.Password: ${{inputs.email_password}}
        SimplySmtp.RentalCancellationLink: "${{inputs.hostname}}/booking/aflys/{id}"
        SimplySmtp.RentalFinishLink: "${{inputs.hostname}}/booking/done/{id}/{phone}"
        SimplySmtp.ResetPasswordLink: "${{inputs.hostname}}/opdater-adganskode?passwordToken={passwordToken}"
        SimplySmtp.ContactMailToEmail: "${{inputs.contact_mail_to_email}}"
